# 컨텍스트마다 별도 인메모리 DB (create-drop 이 다른 테스트 컨텍스트의 테이블을 지우지 않게)
spring:
  datasource:
    url: jdbc:h2:mem:fds_${random.uuid};MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false

fds:
  seed:
    employee-password: test-seed-password
