name: CD

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: cd-${{ github.ref }}
  # PR 은 새 커밋이 오면 이전 검증을 취소한다. 배포는 실행 중인 것을 취소하지 않고, 대기 중인 배포는 가장 최근 것 하나만 남는다
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    services:
      # 이미지 스모크용 DB: 운영과 같은 prod 프로필로 기동해 Flyway 마이그레이션과 스키마 검증까지 확인한다
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: smoke
          MYSQL_DATABASE: fds_bank
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -psmoke"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      # 이 job 은 PR 코드도 빌드하므로 packages: write 토큰을 .git/config 에 남기지 않는다
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v5

      # PR 의 테스트는 CI 가 맡는다. 푸시(배포 경로)에서는 CI 와 같은 검증을 다시 게이트로 건다
      - name: Build jar
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            ./gradlew bootJar --console=plain
          else
            ./gradlew check bootJar --console=plain
          fi

      - uses: docker/setup-buildx-action@v4

      # sha 태그는 배포·롤백이 가리키는 불변 이름이다. v* 태그 실행은 같은 커밋을 다시 빌드하므로 sha 태그를 덮어쓰지 않게 붙이지 않는다
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=sha,format=short,enable=${{ !startsWith(github.ref, 'refs/tags/') }}

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: |
            ${{ steps.meta.outputs.tags }}
            donguri-server:smoke
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 배포 가능한 이미지인지 확인: 실제로 컨테이너를 띄워 헬스체크가 UP 이어야 한다
      - name: Smoke test image
        run: |
          docker run -d --name smoke --network host \
            -e SPRING_PROFILES_ACTIVE=prod \
            -e DB_URL='jdbc:mysql://127.0.0.1:3306/fds_bank?serverTimezone=Asia/Seoul&characterEncoding=UTF-8&sessionVariables=innodb_lock_wait_timeout=3' \
            -e DB_USERNAME=root \
            -e DB_PASSWORD=smoke \
            -e JWT_SECRET="$(openssl rand -base64 32)" \
            donguri-server:smoke
          for _ in $(seq 1 60); do
            if curl -sf --max-time 2 http://127.0.0.1:8080/actuator/health | grep -q '"status":"UP"'; then
              echo "SMOKE OK"
              exit 0
            fi
            [ "$(docker inspect --format '{{.State.Running}}' smoke)" = "true" ] || break
            sleep 2
          done
          echo "SMOKE FAILED — 컨테이너 로그:"
          docker logs smoke
          exit 1

      # 레지스트리에는 main 과 v* 태그만 올린다. 다른 브랜치의 수동 실행은 스모크까지만 한다
      - if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        name: Push image
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          if [ -z "$TAGS" ]; then
            echo "::error::푸시할 이미지 태그가 없습니다. 버전 태그는 vX.Y.Z 형식이어야 합니다"
            exit 1
          fi
          while read -r tag; do
            [ -n "$tag" ] && docker push "$tag"
          done <<< "$TAGS"

  deploy:
    needs: image
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Secrets 는 이 environment 에 등록한다. 승인 규칙(Required reviewers)은 Secrets 를 등록할 때 함께 켠다 — 먼저 켜면 건너뛸 실행도 승인을 기다린다
    environment: production
    permissions:
      contents: read
      packages: read
    env:
      EC2_HOST: ${{ secrets.EC2_HOST }}
      EC2_USER: ${{ secrets.EC2_USER }}
    steps:
      # EC2 준비 전(Secrets 전부 미등록)에는 배포를 건너뛰고 성공으로 끝낸다. 일부만 있으면 설정 실수라 실패한다.
      # 존재 여부만 보면 되므로 값 대신 true/false 만 넘긴다
      - id: config
        name: Check deploy config
        env:
          HAS_EC2_HOST: ${{ secrets.EC2_HOST != '' }}
          HAS_EC2_USER: ${{ secrets.EC2_USER != '' }}
          HAS_EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY != '' }}
          HAS_EC2_KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS != '' }}
        run: |
          missing=""
          present=0
          for name in EC2_HOST EC2_USER EC2_SSH_KEY EC2_KNOWN_HOSTS; do
            flag="HAS_${name}"
            if [ "${!flag}" = "true" ]; then
              present=$((present + 1))
            else
              missing="$missing $name"
            fi
          done
          if [ -z "$missing" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          elif [ "$present" -eq 0 ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            msg="배포 건너뜀: production environment 에 EC2 Secrets 가 없습니다. 이미지는 GHCR 에 푸시됐습니다. 준비 방법은 deploy/ec2/README.md"
            echo "::notice::$msg"
            echo "$msg" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error::production environment 에 Secrets 가 일부만 있습니다. 빠진 것:$missing (deploy/ec2/README.md 참고)"
            exit 1
          fi

      - if: steps.config.outputs.ready == 'true'
        uses: actions/checkout@v5

      - if: steps.config.outputs.ready == 'true'
        name: Configure SSH
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/ec2
          chmod 600 ~/.ssh/ec2
          printf '%s\n' "$EC2_KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf 'Host ec2\n  HostName %s\n  User %s\n  IdentityFile ~/.ssh/ec2\n  BatchMode yes\n  StrictHostKeyChecking yes\n' \
            "$EC2_HOST" "$EC2_USER" > ~/.ssh/config

      # 아래 ssh 명령의 변수는 러너 값(계정, 이미지 이름)을 EC2 로 넘기려고 일부러 러너에서 전개한다
      - if: steps.config.outputs.ready == 'true'
        name: Log in to GHCR on EC2
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # shellcheck disable=SC2029
          printf '%s' "$GHCR_TOKEN" | ssh ec2 "docker login ghcr.io -u '$GITHUB_ACTOR' --password-stdin"

      - if: steps.config.outputs.ready == 'true'
        name: Deploy
        run: |
          image="${REGISTRY}/${IMAGE_NAME,,}:sha-${GITHUB_SHA::7}"
          # shellcheck disable=SC2029
          ssh ec2 "bash -s -- '$image'" < deploy/ec2/deploy.sh

      - if: always() && steps.config.outputs.ready == 'true'
        name: Log out of GHCR on EC2
        run: ssh ec2 "docker logout ghcr.io" || true
