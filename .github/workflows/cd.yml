name: CD

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: cd-${{ github.ref }}
  # PR 은 새 커밋이 오면 이전 검증을 취소한다. main·태그 푸시는 실행 중인 것을 취소하지 않고, 대기 중인 것은 가장 최근 것 하나만 남는다
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    services:
      # 이미지 스모크용 DB: 운영 DB(TiDB Cloud Starter)와 같은 TiDB 로 prod 프로필을 기동해 Flyway 마이그레이션과 스키마 검증까지 확인한다.
      # 단일 노드(unistore)로 뜨며 root 비밀번호는 없다. 이미지에 헬스체크용 클라이언트가 없어 준비 대기는 아래 단계에서 상태 포트로 한다
      tidb:
        image: pingcap/tidb:v8.5.5
        ports:
          - 4000:4000
          - 10080:10080
    steps:
      # 이 job 은 PR 코드도 빌드하므로 packages: write 토큰을 .git/config 에 남기지 않는다
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - if: github.event_name != 'pull_request'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - if: github.event_name != 'pull_request'
        uses: gradle/actions/setup-gradle@v5

      # jar 는 이미지 안에서 빌드한다. PR 의 테스트는 CI 가 맡고, 푸시(배포 경로)에서는 CI 와 같은 검증을 다시 게이트로 건다
      - if: github.event_name != 'pull_request'
        name: Check
        run: ./gradlew check --console=plain

      - uses: docker/setup-buildx-action@v4

      # sha 태그는 커밋을 가리키는 불변 이름이다 (수동 롤백·추적용). v* 태그 실행은 같은 커밋을 다시 빌드하므로 sha 태그를 덮어쓰지 않게 붙이지 않는다
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=sha,format=short,enable=${{ !startsWith(github.ref, 'refs/tags/') }}

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: |
            ${{ steps.meta.outputs.tags }}
            safeflow-server:smoke
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Wait for TiDB
        run: |
          for _ in $(seq 1 60); do
            curl -sf --max-time 2 http://127.0.0.1:10080/status > /dev/null && exit 0
            sleep 2
          done
          echo "TiDB 가 준비되지 않았습니다"
          exit 1

      # 배포 가능한 이미지인지 확인: 실제로 컨테이너를 띄워 헬스체크가 UP 이어야 한다.
      # Render 처럼 PORT 를 주고 그 포트로 확인한다 (기본값 8080 이 아닌 포트로 떠야 통과).
      # Render free 인스턴스와 같은 자원(512 MB, 0.1 CPU)으로 제한해 메모리 부족과 느린 기동을 배포 전에 잡는다
      - name: Smoke test image
        run: |
          docker run -d --name smoke --network host \
            --memory 512m --cpus 0.1 \
            -e PORT=18081 \
            -e SPRING_PROFILES_ACTIVE=prod \
            -e DB_URL='jdbc:mysql://127.0.0.1:4000/fds_bank?createDatabaseIfNotExist=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8&sessionVariables=innodb_lock_wait_timeout=3' \
            -e DB_USERNAME=root \
            -e DB_PASSWORD= \
            -e JWT_SECRET="$(openssl rand -base64 32)" \
            safeflow-server:smoke
          # 0.1 CPU 에서는 기동이 수 분 걸릴 수 있어 최대 6분 기다린다
          for _ in $(seq 1 180); do
            if curl -sf --max-time 2 http://127.0.0.1:18081/actuator/health | grep -q '"status":"UP"'; then
              echo "SMOKE OK"
              exit 0
            fi
            [ "$(docker inspect --format '{{.State.Running}}' smoke)" = "true" ] || break
            sleep 2
          done
          echo "SMOKE FAILED — 컨테이너 로그:"
          docker logs smoke
          exit 1

      # 레지스트리에는 main 과 v* 태그만 올린다. 다른 브랜치의 수동 실행은 스모크까지만 한다
      - if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        name: Push image
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          if [ -z "$TAGS" ]; then
            echo "::error::푸시할 이미지 태그가 없습니다. 버전 태그는 vX.Y.Z 형식이어야 합니다"
            exit 1
          fi
          while read -r tag; do
            [ -n "$tag" ] && docker push "$tag"
          done <<< "$TAGS"
