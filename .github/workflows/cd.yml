name: CD

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: cd-${{ github.ref }}
  # PR 은 새 커밋이 오면 이전 검증을 취소하고, 배포는 취소하지 않고 순서대로 실행한다
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    services:
      # 이미지 스모크용 DB: 운영과 같은 prod 프로필로 기동해 Flyway 마이그레이션과 스키마 검증까지 확인한다
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: smoke
          MYSQL_DATABASE: fds_bank
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -psmoke"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v5

      # PR 의 테스트는 CI 가 맡는다. 푸시(배포 경로)에서는 CI 와 같은 검증을 다시 게이트로 건다
      - name: Build jar
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            ./gradlew bootJar --console=plain
          else
            ./gradlew check bootJar --console=plain
          fi

      - uses: docker/setup-buildx-action@v4

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=sha,format=short

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: |
            ${{ steps.meta.outputs.tags }}
            donguri-server:smoke
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 배포 가능한 이미지인지 확인: 실제로 컨테이너를 띄워 헬스체크가 UP 이어야 한다
      - name: Smoke test image
        run: |
          docker run -d --name smoke --network host \
            -e SPRING_PROFILES_ACTIVE=prod \
            -e DB_URL='jdbc:mysql://127.0.0.1:3306/fds_bank?serverTimezone=Asia/Seoul&characterEncoding=UTF-8&sessionVariables=innodb_lock_wait_timeout=3' \
            -e DB_USERNAME=root \
            -e DB_PASSWORD=smoke \
            -e JWT_SECRET="$(openssl rand -base64 32)" \
            donguri-server:smoke
          for _ in $(seq 1 60); do
            if curl -sf --max-time 2 http://127.0.0.1:8080/actuator/health | grep -q '"status":"UP"'; then
              echo "SMOKE OK"
              exit 0
            fi
            [ "$(docker inspect --format '{{.State.Running}}' smoke)" = "true" ] || break
            sleep 2
          done
          echo "SMOKE FAILED — 컨테이너 로그:"
          docker logs smoke
          exit 1

      - if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - if: github.event_name != 'pull_request'
        name: Push image
        run: |
          while read -r tag; do
            [ -n "$tag" ] && docker push "$tag"
          done <<< "${{ steps.meta.outputs.tags }}"

  deploy:
    needs: image
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Secrets 는 이 environment 에 등록한다. 승인 규칙이 필요하면 GitHub 설정에서 추가한다
    environment: production
    permissions:
      contents: read
      packages: read
    env:
      EC2_HOST: ${{ secrets.EC2_HOST }}
      EC2_USER: ${{ secrets.EC2_USER }}
    steps:
      - uses: actions/checkout@v5

      - name: Configure SSH
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
        run: |
          missing=""
          for name in EC2_HOST EC2_USER EC2_SSH_KEY EC2_KNOWN_HOSTS; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::production environment 에 Secrets 가 없습니다:$missing (deploy/ec2/README.md 참고)"
            exit 1
          fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/ec2
          chmod 600 ~/.ssh/ec2
          printf '%s\n' "$EC2_KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf 'Host ec2\n  HostName %s\n  User %s\n  IdentityFile ~/.ssh/ec2\n  BatchMode yes\n  StrictHostKeyChecking yes\n' \
            "$EC2_HOST" "$EC2_USER" > ~/.ssh/config

      - name: Log in to GHCR on EC2
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | ssh ec2 "docker login ghcr.io -u '${{ github.actor }}' --password-stdin"

      - name: Deploy
        run: |
          image="${REGISTRY}/${IMAGE_NAME,,}:sha-${GITHUB_SHA::7}"
          ssh ec2 "bash -s -- '$image'" < deploy/ec2/deploy.sh

      - if: always()
        name: Log out of GHCR on EC2
        run: ssh ec2 "docker logout ghcr.io" || true
