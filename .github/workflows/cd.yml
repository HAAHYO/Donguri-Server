name: CD

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: cd-${{ github.ref }}
  # PR 은 새 커밋이 오면 이전 검증을 취소하고, 배포는 취소하지 않고 순서대로 실행한다
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    services:
      # 이미지 스모크용 DB: 운영과 같은 prod 프로필로 기동해 Flyway 마이그레이션과 스키마 검증까지 확인한다
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: smoke
          MYSQL_DATABASE: fds_bank
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -psmoke"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v5

      # PR 의 테스트는 CI 가 맡는다. 푸시(배포 경로)에서는 CI 와 같은 검증을 다시 게이트로 건다
      - name: Build jar
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            ./gradlew bootJar --console=plain
          else
            ./gradlew check bootJar --console=plain
          fi

      - uses: docker/setup-buildx-action@v4

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=sha,format=short

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: |
            ${{ steps.meta.outputs.tags }}
            donguri-server:smoke
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 배포 가능한 이미지인지 확인: 실제로 컨테이너를 띄워 헬스체크가 UP 이어야 한다
      - name: Smoke test image
        run: |
          docker run -d --name smoke --network host \
            -e SPRING_PROFILES_ACTIVE=prod \
            -e DB_URL='jdbc:mysql://127.0.0.1:3306/fds_bank?serverTimezone=Asia/Seoul&characterEncoding=UTF-8&sessionVariables=innodb_lock_wait_timeout=3' \
            -e DB_USERNAME=root \
            -e DB_PASSWORD=smoke \
            -e JWT_SECRET="$(openssl rand -base64 32)" \
            donguri-server:smoke
          for _ in $(seq 1 60); do
            if curl -sf --max-time 2 http://127.0.0.1:8080/actuator/health | grep -q '"status":"UP"'; then
              echo "SMOKE OK"
              exit 0
            fi
            [ "$(docker inspect --format '{{.State.Running}}' smoke)" = "true" ] || break
            sleep 2
          done
          echo "SMOKE FAILED — 컨테이너 로그:"
          docker logs smoke
          exit 1

      - if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - if: github.event_name != 'pull_request'
        name: Push image
        run: |
          while read -r tag; do
            [ -n "$tag" ] && docker push "$tag"
          done <<< "${{ steps.meta.outputs.tags }}"

