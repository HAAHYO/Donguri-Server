name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      # 워크플로(actionlint, run: 스크립트는 shellcheck 연동)와 셸 스크립트(shellcheck) 정적 검사.
      # 두 도구 모두 고정 버전을 받아 체크섬을 검증한다. 러너 이미지가 바뀌어도 판정이 바뀌지 않게 한다
      - name: Lint workflows and shell scripts
        env:
          ACTIONLINT_VERSION: 1.7.7
          ACTIONLINT_SHA256: 023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757
          SHELLCHECK_VERSION: 0.11.0
          SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
        # 기본 셸은 pipefail 이 없다. 파이프 앞쪽 명령의 실패도 단계 실패로 잡는다
        shell: bash
        run: |
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl -sSfL -o "$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint

          archive="$RUNNER_TEMP/shellcheck.tar.xz"
          curl -sSfL -o "$archive" \
            "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          echo "${SHELLCHECK_SHA256}  ${archive}" | sha256sum -c -
          tar -xJf "$archive" -C "$RUNNER_TEMP" --strip-components=1 "shellcheck-v${SHELLCHECK_VERSION}/shellcheck"
          shellcheck="$RUNNER_TEMP/shellcheck"
          "$shellcheck" --version | sed -n 2p

          "$RUNNER_TEMP/actionlint" -color -shellcheck "$shellcheck"
          git ls-files -z '*.sh' | xargs -0 "$shellcheck"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      # Gradle 캐시 + wrapper 검증(위조된 gradle-wrapper.jar 차단)
      - uses: gradle/actions/setup-gradle@v5

      # 에이전트 하네스 hook(guard_git.py) 회귀 테스트
      - name: Harness tests
        run: python3 .claude/hooks/test_guard_git.py

      # 로컬 Stop hook과 동일한 검증 명령 (ktlint + 테스트)
      - name: Check
        run: ./gradlew check --console=plain

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            build/reports/tests/
            build/reports/ktlint/
          retention-days: 7
