name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      # Gradle 캐시 + wrapper 검증(위조된 gradle-wrapper.jar 차단)
      - uses: gradle/actions/setup-gradle@v5

      # 에이전트 하네스 hook(guard_git.py) 회귀 테스트
      - name: Harness tests
        run: python3 .claude/hooks/test_guard_git.py

      # 로컬 Stop hook과 동일한 검증 명령 (ktlint + 테스트)
      - name: Check
        run: ./gradlew check --console=plain

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            build/reports/tests/
            build/reports/ktlint/
          retention-days: 7
